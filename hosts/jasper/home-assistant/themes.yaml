# Light theme with a Teenage Engineering feel: warm greys, black ink, one
# orange accent, flat square cards, monospace numbers.
te-light:
  modes:
    light:
      primary-background-color: "#e9e7e2"
      secondary-background-color: "#e1dfd9"
      lovelace-background: "#e9e7e2"
      card-background-color: "#f5f4f0"
      ha-card-background: "#f5f4f0"
      ha-card-border-color: "#d3d0ca"
      ha-card-border-width: "1px"
      ha-card-border-radius: "2px"
      ha-card-box-shadow: "none"
      primary-text-color: "#151515"
      secondary-text-color: "#8a8781"
      disabled-text-color: "#b5b2ab"
      divider-color: "#d3d0ca"
      primary-color: "#151515"
      accent-color: "#ff5a1f"
      success-color: "#3f9a5c"
      error-color: "#e0412b"
      warning-color: "#ff5a1f"
      state-icon-color: "#151515"
      app-header-background-color: "#e9e7e2"
      app-header-text-color: "#151515"
      app-header-border-bottom: "1.5px solid #151515"
      sidebar-background-color: "#e1dfd9"
      sidebar-text-color: "#151515"
      sidebar-icon-color: "#8a8781"
      sidebar-selected-text-color: "#ff5a1f"
      sidebar-selected-icon-color: "#ff5a1f"
      ha-font-family-body: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      ha-font-family-heading: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
      ha-font-family-code: "'JetBrains Mono', 'IBM Plex Mono', Consolas, ui-monospace, monospace"
      primary-font-family: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
